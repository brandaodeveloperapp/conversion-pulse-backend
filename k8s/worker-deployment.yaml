apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpulse-worker
  namespace: conversion-pulse
  labels:
    app: cpulse-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cpulse-worker
  template:
    metadata:
      labels:
        app: cpulse-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: cpulse-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/worker.js
          envFrom:
            - configMapRef:
                name: cpulse-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cpulse-db-secret
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: cpulse-rabbitmq-secret
                  key: RABBITMQ_URL
            - name: OTEL_SERVICE_NAME
              value: conversion-pulse-worker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f dist/worker.js
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
