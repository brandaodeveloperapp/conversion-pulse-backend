name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: brandaodeveloperapp/conversion-pulse-backend

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: sha-${{ needs.build-and-push.outputs.sha_short }}
      REGISTRY: ghcr.io
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,REGISTRY,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -e
            echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
            cd /opt/conversion-pulse
            git pull --ff-only
            echo "IMAGE_TAG=${IMAGE_TAG}" > .image-tag
            docker compose --env-file .env --env-file .image-tag -f docker-compose.prod.yml pull api worker
            docker compose --env-file .env --env-file .image-tag -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f --filter "until=168h"
            docker logout "$REGISTRY"

      - name: Smoke test health endpoint
        run: |
          status=000
          for i in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w '%{http_code}' https://conversion-pulse.brandaodeveloper.com.br/health)
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "final status: $status"
          exit 1
