apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: conversion-pulse

labels:
  - pairs:
      app.kubernetes.io/part-of: conversion-pulse

resources:
  - namespace.yaml
  - configmap.yaml
  # secret.example.yaml is intentionally excluded: real secrets are applied
  # out of band so a kustomize build can never overwrite them with placeholders.
  - postgres-statefulset.yaml
  - redis-statefulset.yaml
  - rabbitmq-statefulset.yaml
  - prometheus-deployment.yaml
  - grafana-deployment.yaml
  - loki-deployment.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployment.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml
  - ingress.yaml
