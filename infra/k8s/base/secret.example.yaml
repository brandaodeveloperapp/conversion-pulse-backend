apiVersion: v1
kind: Secret
metadata:
  name: cpulse-db-secret
  namespace: conversion-pulse
type: Opaque
stringData:
  POSTGRES_USER: cpulse
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: cpulse
  DATABASE_URL: postgres://cpulse:changeme@cpulse-db.conversion-pulse.svc.cluster.local:5432/cpulse
---
apiVersion: v1
kind: Secret
metadata:
  name: cpulse-rabbitmq-secret
  namespace: conversion-pulse
type: Opaque
stringData:
  RABBITMQ_USER: cpulse
  RABBITMQ_PASSWORD: changeme
  RABBITMQ_URL: amqp://cpulse:changeme@cpulse-rabbitmq.conversion-pulse.svc.cluster.local:5672
---
apiVersion: v1
kind: Secret
metadata:
  name: cpulse-grafana-secret
  namespace: conversion-pulse
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: changeme
