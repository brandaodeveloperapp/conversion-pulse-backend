apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cpulse-api
  namespace: conversion-pulse
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: cpulse.example.local
      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: cpulse-api
                port:
                  number: 80
