name: conversion-pulse

x-app-env: &app-env
  NODE_ENV: development
  PORT: 3000
  DATABASE_URL: postgres://${POSTGRES_USER:-cpulse}:${POSTGRES_PASSWORD:-cpulse}@db:5432/${POSTGRES_DB:-cpulse}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
  REDIS_URL: redis://redis:6379
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
  RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-cpulse}:${RABBITMQ_PASSWORD:-cpulse}@rabbitmq:5672
  ROLLUP_EXCHANGE: ${ROLLUP_EXCHANGE:-cpulse.rollup}
  ROLLUP_QUEUE: ${ROLLUP_QUEUE:-cpulse.rollup.refresh}
  ROLLUP_ROUTING_KEY: ${ROLLUP_ROUTING_KEY:-rollup.refresh}
  ROLLUP_CRON: "${ROLLUP_CRON:-0 */15 * * * *}"
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  METRICS_ENABLED: "true"
  WORKER_METRICS_PORT: 9101
  OTEL_SERVICE_NAME: conversion-pulse-api

services:
  db:
    image: postgres:17-alpine
    container_name: cpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpulse}
      POSTGRES_DB: ${POSTGRES_DB:-cpulse}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - random_page_cost=1.1
      - -c
      - effective_cache_size=2GB
      - -c
      - max_parallel_workers_per_gather=4
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./data:/import:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - cpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpulse} -d ${POSTGRES_DB:-cpulse}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cpulse-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - cpulse
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cpulse-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cpulse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cpulse}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - cpulse
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpulse-api
    restart: unless-stopped
    command: ["node", "dist/main.js"]
    environment:
      <<: *app-env
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - cpulse
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpulse-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: conversion-pulse-worker
    networks:
      - cpulse
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9101/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: cpulse-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - cpulse
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  loki:
    image: grafana/loki:3.1.0
    container_name: cpulse-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - cpulse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  promtail:
    image: grafana/promtail:3.1.0
    container_name: cpulse-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - cpulse
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cpulse-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - cpulse
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  cpulse:
    name: cpulse

volumes:
  db_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  loki_data:
  grafana_data:
